# ================================================================
# Quiz Service — Base Configuration
# ================================================================
# Adaptive MCQ quiz generation via Spring AI Structured Output.
# Chat: Groq (llama-3.1-8b-instant) — fast, reliable JSON output
# Port: 8086  |  DB: quiz_db (PostgreSQL)
# ================================================================
server:
  port: 8086

spring:
  application:
    name: quiz-service

  # Build the DispatcherServlet during startup rather than lazily on the first
  # request. Spring's default defers it, which made the very first call to each
  # service stall ~20s while the servlet bootstrapped — long enough that the UI
  # looked frozen. Doing it at boot moves that cost into startup, where it's
  # expected.
  mvc:
    servlet:
      load-on-startup: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Spring AI — Groq via OpenAI-compatible API ───────────────
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      # See study-agent-service's application.yml for why "/v1" is required —
      # without it every Groq call 404s on "/openai/chat/completions".
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: llama-3.1-8b-instant
          temperature: 0.7

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    listener:
      missing-topics-fatal: false

# ── GuruAI Quiz Properties ──────────────────────────────────────
guruai:
  # Must match api-gateway's INTERNAL_SERVICE_SECRET — see InternalAccessFilter.
  internal:
    secret: ${INTERNAL_SERVICE_SECRET}
  services:
    # Read by KnowledgeServiceClient to resolve "Auto" quiz difficulty from
    # the student's mastery. (An earlier guruai.services block was removed as
    # dead config because nothing read it — this one has a real consumer.)
    knowledge-service-url: ${KNOWLEDGE_SERVICE_URL:http://localhost:8085}
    # Read by DocumentServiceClient to ground quiz generation in the
    # student's uploaded documents instead of a bare topic name.
    document-service-url: ${DOCUMENT_SERVICE_URL:http://localhost:8082}
  # NOTE: an earlier "quiz:" block here (default-question-count,
  # max-question-count, generation-prompt) was removed as dead config —
  # QuizGeneratorServiceImpl hardcodes its own SYSTEM_PROMPT text block and
  # reads questionCount straight from the incoming request, so nothing ever
  # read these keys.

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.guruai.quiz: INFO
    org.springframework.ai: WARN
