# ================================================================
# Study Agent Service — Base Configuration
# ================================================================
# Core AI service: CRAG pipeline, session management, learning path.
# Port: 8083  |  DB: agent_db (PostgreSQL)
# ================================================================
server:
  port: 8083

spring:
  application:
    name: study-agent-service

  # Build the DispatcherServlet during startup rather than lazily on the first
  # request. Spring's default defers it, which made the very first call to each
  # service stall ~20s while the servlet bootstrapped — long enough that the UI
  # looked frozen. Doing it at boot moves that cost into startup, where it's
  # expected.
  mvc:
    servlet:
      load-on-startup: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Groq (Chat) via Spring AI OpenAI adapter
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      # Groq's OpenAI-compatible chat endpoint is /openai/v1/chat/completions —
      # the underlying openai-java SDK appends "/chat/completions" directly to
      # this base-url without inserting "/v1" itself, so omitting "/v1" here
      # 404s every call ("Unknown request URL: POST /openai/chat/completions").
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: llama-3.1-8b-instant
          temperature: 0.5
          max-tokens: 2048

# Internal service URLs (overridden per profile)
guruai:
  # Must match api-gateway's INTERNAL_SERVICE_SECRET — see InternalAccessFilter.
  internal:
    secret: ${INTERNAL_SERVICE_SECRET}
  services:
    document-service-url: ${DOCUMENT_SERVICE_URL:http://document-service:8082}
    memory-service-url: ${MEMORY_SERVICE_URL:http://user-memory-service:8088}
    knowledge-service-url: ${KNOWLEDGE_SERVICE_URL:http://knowledge-service:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.guruai.agent: INFO
    org.springframework.ai: WARN
