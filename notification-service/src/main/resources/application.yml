# ================================================================
# Notification Service — Base Configuration
# ================================================================
# WebSocket (STOMP) push + Kafka event consumer.
# Listens to: user.registered, mastery.dropped, quiz.completed, document.indexed
# Port: 8090  |  DB: notif_db (PostgreSQL)
# ================================================================
server:
  port: 8090

spring:
  application:
    name: notification-service

  # Build the DispatcherServlet during startup rather than lazily on the first
  # request. Spring's default defers it, which made the very first call to each
  # service stall ~20s while the servlet bootstrapped — long enough that the UI
  # looked frozen. Doing it at boot moves that cost into startup, where it's
  # expected.
  mvc:
    servlet:
      load-on-startup: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.guruai.common.events"
    listener:
      missing-topics-fatal: false

# Must match api-gateway's INTERNAL_SERVICE_SECRET — see InternalAccessFilter.
guruai:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.guruai.notification: INFO
    org.springframework.kafka: WARN
    org.springframework.web.socket: WARN
