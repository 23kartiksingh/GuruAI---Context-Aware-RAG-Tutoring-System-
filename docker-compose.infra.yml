# ================================================================
# GuruAI — Infrastructure Only (Development Fast Start)
# ================================================================
# Starts ALL databases + Redis + Kafka — but NOT the Java services.
# Use this during development so you can run services in your IDE.
#
# Usage:
#   docker-compose -f docker-compose.infra.yml up -d
#   docker-compose -f docker-compose.infra.yml down
#   docker-compose -f docker-compose.infra.yml down -v   # wipe all data
# ================================================================

services:

  # ════════════════════════════════════════════════════════════
  # POSTGRESQL — one instance, eight isolated databases
  # ════════════════════════════════════════════════════════════
  # "Database per service" means each service owns its own DATABASE
  # (schema isolation, own credentials scope) — not that each needs its
  # own server process. This used to be 8 separate containers, which is
  # the production topology but cost ~500MB RAM on an 8GB dev laptop
  # for zero functional difference. scripts/init-databases.sql creates
  # the 8 databases on first boot; the pgvector image is a superset of
  # plain postgres, so document_db gets its vector extension too.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: guruai-postgres
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_DB:       auth_db
      POSTGRES_USER:     ${DB_USER:-guruai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-guruai_secret_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - guruai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-guruai} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ════════════════════════════════════════════════════════════
  # REDIS — Shared cache / rate limiting / JWT blacklist
  # ════════════════════════════════════════════════════════════

  redis:
    image: redis:7-alpine
    container_name: guruai-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-guruai_redis_2026}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - guruai-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-guruai_redis_2026}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Redis Commander — Web UI for inspecting Redis data
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: guruai-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS:     "local:redis:6379:0:${REDIS_PASSWORD:-guruai_redis_2026}"
      HTTP_USER:       admin
      HTTP_PASSWORD:   ${REDIS_UI_PASSWORD:-admin123}
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - guruai-network

  # ════════════════════════════════════════════════════════════
  # APACHE KAFKA — Event Bus (KRaft mode — no Zookeeper needed)
  # ════════════════════════════════════════════════════════════

  # Official Apache Kafka image (KRaft mode — no Zookeeper).
  # NOTE: this used to be bitnami/kafka:3.7, but Broadcom pulled Bitnami's
  # free images from Docker Hub in 2025, so that tag no longer resolves.
  # The official image uses KAFKA_* env vars instead of Bitnami's KAFKA_CFG_*.
  kafka:
    image: apache/kafka:3.9.0
    container_name: guruai-kafka
    restart: unless-stopped
    environment:
      # Modest heap — the default 1GB is overkill for a single-node dev
      # broker and matters on an 8GB machine running 9 other JVMs.
      KAFKA_HEAP_OPTS:                       "-Xmx384m -Xms256m"
      # KRaft settings (single node acts as both controller and broker)
      KAFKA_NODE_ID:                         1
      KAFKA_PROCESS_ROLES:                   controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS:        1@kafka:9093
      # Listeners
      KAFKA_LISTENERS:                       PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS:            PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:  CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:       CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME:      PLAINTEXT
      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:       "true"
      KAFKA_NUM_PARTITIONS:                  3
      KAFKA_DEFAULT_REPLICATION_FACTOR:      1
      # Single-broker essentials: these internal topics default to
      # replication factor 3, which can never be satisfied with one broker —
      # without these overrides, consumer groups fail to initialise.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:        1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:           1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:        0
      KAFKA_LOG_RETENTION_HOURS:             168
      KAFKA_LOG_DIRS:                        /var/lib/kafka/data
    ports:
      - "9092:9092"    # internal (service-to-service)
      - "9094:9094"    # external (host machine access for debugging)
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - guruai-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 20s
      # Generous windows on purpose. On a loaded 8GB dev machine the broker can
      # spend minutes replaying __consumer_offsets before it answers a --list,
      # and the probe itself is a JVM launch (slow when CPU is contended). The
      # old 30s start_period / 10s timeout marked Kafka unhealthy while it was
      # merely still starting, which then blocked every service that
      # depends_on it with "dependency failed to start".
      timeout: 20s
      retries: 15
      start_period: 180s

  # Kafka Topic Initializer — creates all 8 topics with correct settings
  kafka-setup:
    image: apache/kafka:3.9.0
    container_name: guruai-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - guruai-network
    entrypoint: ["/bin/bash", "-c"]
    # One flat command per topic — the previous multi-line version with
    # backslash continuations got mangled by YAML/compose quoting and every
    # kafka-topics.sh call silently ran with no arguments. ($$ = literal $
    # for compose.)
    command:
      - |
        echo '⏳ Waiting for Kafka to be fully ready...'
        sleep 5
        TOPICS='user.registered document.indexed chat.message.saved quiz.completed flashcard.reviewed mastery.dropped session.deleted weak.topic.reminder'
        # Retry each topic instead of assuming one attempt works. On a loaded
        # machine createTopics can fail with "Timed out waiting for a node
        # assignment" while the broker is still loading __consumer_offsets.
        # The previous version printed "Topic ready" unconditionally after the
        # command, so a timeout looked identical to success and session.deleted
        # silently never got created.
        for t in $$TOPICS; do
          created=0
          for attempt in 1 2 3 4 5; do
            if /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server kafka:9092 \
                 --topic "$$t" --partitions 3 --replication-factor 1 --if-not-exists 2>&1; then
              created=1
              break
            fi
            echo "  ↻ attempt $$attempt failed for $$t, retrying in 10s..."
            sleep 10
          done
          if [ "$$created" = "1" ]; then echo "✅ Topic ready: $$t"; else echo "❌ FAILED to create: $$t"; fi
        done

        # Verify against what the broker actually reports, rather than trusting
        # the create calls above.
        echo '── Verifying ──'
        ACTUAL=$$(/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092)
        echo "$$ACTUAL"
        missing=0
        for t in $$TOPICS; do
          echo "$$ACTUAL" | grep -qx "$$t" || { echo "❌ MISSING: $$t"; missing=1; }
        done
        if [ "$$missing" = "0" ]; then echo '🎉 All 8 Kafka topics verified.'; else echo '⚠️  Some topics are missing — see above.'; fi

  # Kafka UI — web dashboard for inspecting topics and messages
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: guruai-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME:            guruai-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      AUTH_TYPE:                        LOGIN_FORM
      SPRING_SECURITY_USER_NAME:        admin
      SPRING_SECURITY_USER_PASSWORD:    ${KAFKA_UI_PASSWORD:-admin123}
    ports:
      - "9000:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - guruai-network

# ════════════════════════════════════════════════════════════
# NAMED VOLUMES
# ════════════════════════════════════════════════════════════
volumes:
  postgres_data:
  redis_data:
  kafka_data:

# ════════════════════════════════════════════════════════════
# NETWORK
# ════════════════════════════════════════════════════════════
networks:
  guruai-network:
    driver: bridge
    name: guruai-network
