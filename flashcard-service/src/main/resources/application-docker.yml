spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/flashcard_db
    username: ${DB_USER:guruai}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  kafka:
    bootstrap-servers: kafka:9092

logging:
  level:
    com.guruai.flashcard: INFO
