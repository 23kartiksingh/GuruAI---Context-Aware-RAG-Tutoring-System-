# Minimal SPA config: React Router handles routing client-side, so any path
# that isn't a real static file (e.g. a hard refresh on /chat) must still
# resolve to index.html, or nginx would 404 it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
