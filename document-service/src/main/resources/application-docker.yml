# ================================================================
# Document Service — DOCKER Profile (docker-compose.yml)
# ================================================================
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/document_db
    username: ${DB_USER:guruai}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3

  data:
    redis:
      host: redis
      password: ${REDIS_PASSWORD}

  kafka:
    bootstrap-servers: kafka:9092

logging:
  level:
    com.guruai.document: INFO
