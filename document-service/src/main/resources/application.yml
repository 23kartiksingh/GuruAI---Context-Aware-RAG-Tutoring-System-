# ================================================================
# Document Service — Base Configuration
# ================================================================
server:
  port: 8082
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB          # max single file upload
      max-request-size: 55MB

spring:
  application:
    name: document-service

  # Build the DispatcherServlet during startup rather than lazily on the first
  # request. Spring's default defers it, which made the very first call to each
  # service stall ~20s while the servlet bootstrapped — long enough that the UI
  # looked frozen. Doing it at boot moves that cost into startup, where it's
  # expected.
  mvc:
    servlet:
      load-on-startup: 1

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Spring AI — Gemini only (this service's single AI provider) ──
  # Provider split (see root README): Gemini owns indexing-time AI —
  # embeddings for pgvector + once-per-upload topic extraction. All
  # conversational AI (tutor chat, CRAG grading, quiz/flashcard
  # generation) runs on Groq in the other services, so the two free
  # tiers share the load instead of one quota eating everything.
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.0          # deterministic for topic extraction
        embedding:
          # Embedding autoconfig binds its own spring.ai.google.genai.embedding.*
          # prefix rather than falling back to the chat block above — without
          # this api-key it defaults to Vertex AI mode and demands a GCP
          # project-id. Also: the correct property is embedding.text.model,
          # not embedding.options.model (that path doesn't exist and was
          # silently ignored).
          api-key: ${GOOGLE_API_KEY}
          text:
            model: gemini-embedding-001
            # gemini-embedding-001 natively outputs 3072-dim vectors, not 768
            # (the V2 migration's comment claiming "768-dim" was simply wrong).
            # The model supports Matryoshka truncation via this property —
            # without it, PgVectorStore's insert fails with "expected 768
            # dimensions, not 3072" the moment it tries to write. 768 keeps
            # the DB schema/docker-compose config as-is rather than needing
            # a 4x-larger vector column.
            dimensions: 768

    # ── pgvector Store ────────────────────────────────────────
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768              # gemini-embedding-001 output dimension
        initialize-schema: false     # Flyway manages the schema (V2 migration)

  # ── Kafka ───────────────────────────────────────────────────
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    # This service was producer-only until it needed to react to
    # session.deleted (drop the session's documents + pgvector chunks).
    consumer:
      group-id: document-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.guruai.common.events"
    listener:
      missing-topics-fatal: false

  # ── Redis — LRU retriever cache ─────────────────────────────
  data:
    redis:
      port: 6379
      connect-timeout: 3000ms
      timeout: 3000ms

# ── GuruAI Document Service Properties ──────────────────────
guruai:
  # Must match api-gateway's INTERNAL_SERVICE_SECRET — see InternalAccessFilter.
  internal:
    secret: ${INTERNAL_SERVICE_SECRET}
  document:
    chunk-size: 1000                  # characters per chunk (ported from Python)
    chunk-overlap: 150                # characters of overlap between chunks
    max-file-size-mb: 50
    allowed-content-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/msword
      - text/plain
      - image/png
      - image/jpeg
      - image/webp
  retriever:
    top-k-dense: 20                   # candidates from vector search
    top-k-keyword: 20                 # candidates from BM25 search
    top-k-final: 5                    # final results after RRF merging
    rrf-k: 60                         # RRF rank constant (60 is standard)
    cache-ttl-seconds: 300            # Redis cache TTL for query results (5 min)

management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    com.guruai.document: INFO
    org.springframework.ai: WARN
    org.apache.tika: WARN
